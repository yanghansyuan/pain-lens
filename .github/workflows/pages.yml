name: Deploy Pain Lens

on:
  push:
    branches: [main]
    paths:
      - 'pain-atlas-tw/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pain-atlas-tw/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
        working-directory: pain-atlas-tw
      - run: npm run build
        working-directory: pain-atlas-tw
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pain-atlas-tw/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
